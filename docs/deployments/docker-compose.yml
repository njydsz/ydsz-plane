name: ydsz-plane

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Limw1020
      POSTGRES_DB: ydsz-plane
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass Limw1020
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "Limw1020", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Mailpit - 本地邮件测试服务
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    volumes:
      - mailpitdata:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    profiles: ["full"]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data

  minio:
    image: minio/minio:latest
    profiles: ["full"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Limw1020
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ..
      dockerfile: docs/deployments/Dockerfile.api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      YDSZ_SERVER_ENV: production
      YDSZ_SERVER_PORT: 8080
      YDSZ_DATABASE_URL: postgres://postgres:Limw1020@postgres:5432/ydsz-plane?sslmode=disable
      YDSZ_REDIS_ADDR: redis:6379
      YDSZ_REDIS_PASSWORD: Limw1020
      YDSZ_AUTH_JWT_SECRET: ${YDSZ_AUTH_JWT_SECRET:?set YDSZ_AUTH_JWT_SECRET in .env}
      YDSZ_LOG_FORMAT: json
    ports:
      - "8080:8080"
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: docs/deployments/Dockerfile.api
    command: ["/app/worker"]
    depends_on:
      api: { condition: service_started }
    environment:
      YDSZ_SERVER_ENV: production
      YDSZ_DATABASE_URL: postgres://postgres:Limw1020@postgres:5432/ydsz-plane?sslmode=disable
      YDSZ_REDIS_ADDR: redis:6379
      YDSZ_REDIS_PASSWORD: Limw1020
      YDSZ_AUTH_JWT_SECRET: ${YDSZ_AUTH_JWT_SECRET:?set YDSZ_AUTH_JWT_SECRET in .env}
      YDSZ_LOG_FORMAT: json
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: docs/deployments/Dockerfile.web
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mailpitdata:
  esdata:
  miniodata:
