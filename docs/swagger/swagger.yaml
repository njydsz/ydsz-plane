    post:
      description: 手动重投指定投递日志（回查 domain_events 重建原始事件并同步重投）
      parameters:
      - description: Webhook ID
        in: path
        name: webhook_id
        required: true
        type: integer
      - description: 日志 ID
        in: path
        name: log_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 重投日志
      tags:
      - webhook
  /webhooks/{webhook_id}/pause:
    post:
      description: '暂停 Webhook 投递（等价于 PATCH { is_active: false }）'
      parameters:
      - description: Webhook ID
        in: path
        name: webhook_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhook.Webhook'
      summary: 暂停投递
      tags:
      - webhook
  /webhooks/{webhook_id}/resume:
    post:
      description: '恢复 Webhook 投递（等价于 PATCH { is_active: true }）'
      parameters:
      - description: Webhook ID
        in: path
        name: webhook_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhook.Webhook'
      summary: 恢复投递
      tags:
      - webhook
