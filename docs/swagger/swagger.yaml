host: localhost:8080
info:
  contact: {}
  description: 项目管理平台 Ydsz Plane 的 REST API（需求/任务/缺陷/迭代/版本/自动化/Webhook/知识库/仪表盘/全局搜索/通知等）。
  title: Ydsz Plane API
  version: 1.0.0
paths:
  /admin/dlq:
    get:
      description: 分页查询 DLQ 死信消息，支持按 unresolved_only 过滤
      parameters:
      - description: 每页数
        in: query
        name: limit
        type: integer
      - description: 偏移
        in: query
        name: offset
        type: integer
      - description: 仅未解决
        in: query
        name: unresolved_only
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 列出死信消息
      tags:
      - dlq
  /admin/dlq/{id}:
    delete:
      description: 将指定死信消息标记为已解决（软删除）
      parameters:
      - description: 死信 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 移除死信消息
      tags:
      - dlq
  /admin/dlq/{id}/retry:
    post:
      description: 将指定死信消息重新入队进行重放
      parameters:
      - description: 死信 ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 重试死信消息
      tags:
      - dlq
  /admin/dlq/cleanup:
    post:
      consumes:
      - application/json
      description: 按 event_ids 批量标记已解决，或按 resolved_all 清理全部已解决记录
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 批量清理死信
      tags:
      - dlq
  /analytics/defect-age:
    get:
      consumes:
      - application/json
      description: 输出按状态分组的缺陷龄统计（min/max/avg/median），及超7天滞留的缺陷明细
      parameters:
      - description: 工作空间 ID
        in: path
        name: workspace_id
        required: true
        type: integer
      - description: 项目 ID
        in: path
        name: project_id
        required: true
        type: integer
      - description: 起始日期
        in: query
        name: date_from
        type: string
      - description: 结束日期
        in: query
        name: date_to
        type: string
      - description: 最低严重程度
        in: query
        name: severity_from
        type: integer
      - description: 最高严重程度
        in: query
        name: severity_to
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/issue.DefectAgeAnalysis'
      summary: 缺陷龄分析
      tags:
      - analytics
  /analytics/defects:
    get:
      consumes:
      - application/json
      description: 输出按模块/严重程度/发现阶段/根因分类/缺陷龄分布/周趋势聚合的缺陷统计数据
      parameters:
      - description: 工作空间 ID
        in: path
        name: workspace_id
        required: true
        type: integer
      - description: 项目 ID
        in: path
        name: project_id
        required: true
        type: integer
      - description: 起始日期（YYYY-MM-DD）
        in: query
        name: date_from
        type: string
      - description: 结束日期（YYYY-MM-DD）
        in: query
        name: date_to
        type: string
      - description: 最低严重程度（1-5）
        in: query
        name: severity_from
        type: integer
      - description: 最高严重程度（1-5）
        in: query
        name: severity_to
        type: integer
      - description: 按模块过滤
        in: query
        name: module_id
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/issue.DefectAnalytics'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errs.AppError'
      summary: 缺陷分析聚合
      tags:
      - analytics
  /analytics/defects/export:
    get:
      consumes:
      - application/json
      description: 按与聚合分析相同的过滤条件导出缺陷明细列表（CSV / xlsx）
      parameters:
      - description: 工作空间 ID
        in: path
        name: workspace_id
        required: true
        type: integer
      - description: 项目 ID
        in: path
        name: project_id
        required: true
        type: integer
      - description: 导出格式：csv（默认）| xlsx
        in: query
        name: format
        type: string
      - description: 起始日期（YYYY-MM-DD）
        in: query
        name: date_from
        type: string
      - description: 结束日期（YYYY-MM-DD）
        in: query
        name: date_to
        type: string
      - description: 最低严重程度（1-5）
        in: query
        name: severity_from
        type: integer
      - description: 最高严重程度（1-5）
        in: query
        name: severity_to
        type: integer
      - description: 按模块过滤
        in: query
        name: module_id
        type: integer
      - description: 按版本过滤（发现或修复版本）
        in: query
        name: version_id
        type: integer
      produces:
      - application/octet-stream
      responses:
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/errs.AppError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/errs.AppError'
      summary: 导出缺陷明细
      tags:
      - analytics
  /analytics/root-cause:
    get:
      consumes:
      - application/json
      description: 输出按根因分类分组的缺陷数量、占比及总计
      parameters:
      - description: 工作空间 ID
        in: path
        name: workspace_id
        required: true
        type: integer
      - description: 项目 ID
        in: path
        name: project_id
        required: true
        type: integer
      - description: 起始日期
        in: query
        name: date_from
        type: string
      - description: 结束日期
        in: query
        name: date_to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/issue.RootCauseAnalysis'
      summary: 根因分布统计
      tags:
      - analytics
  /attachments:
    get:
      description: 按工作项类型 + ID 查询关联的附件列表
      parameters:
      - description: 工作项类型 (task/requirement/defect/issue)
        in: query
        name: entity_type
        required: true
        type: string
      - description: 工作项 ID
        in: query
        name: entity_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errs.AppError'
      summary: 列出附件
      tags:
      - attachment
  /attachments/{id}:
    delete:
      description: 按附件 ID 删除附件记录及其底层存储对象
      parameters:
      - description: 附件 ID
        in: path
        name: id
        required: true
        type: integer
      - description: 工作项类型 (task/requirement/defect)
        in: query
        name: entity_type
        required: true
        type: string
      responses:
        "204":
          description: No Content
      summary: 删除附件
      tags:
      - attachment
  /attachments/confirm:
    post:
      consumes:
      - application/json
      description: 客户端直传成功后提交元信息，写入附件 DB 记录
      produces:
      - application/json
      responses:
