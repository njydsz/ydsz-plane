basePath: /api/v1
definitions:
  ai.AssignCandidate:
    properties:
      display_name:
        type: string
      reason:
        type: string
      score:
        description: 0-100 综合评分
        type: number
      user_id:
        type: integer
    type: object
  ai.ClassifyResult:
    properties:
      confidence:
        description: 置信度 0-1
        type: number
      priority:
        description: critical | high | medium | low
        type: string
      type_code:
        description: requirement | task | defect
        type: string
    type: object
  ai.DuplicateCandidate:
    properties:
      identifier:
        type: string
      issue_id:
        type: integer
      similarity:
        description: 0-1 相似度
        type: number
      title:
        type: string
    type: object
  ai.FixGrammarResult:
    properties:
      fixed_text:
        description: 修正后全文
        type: string
      model:
        description: rule-engine
        type: string
      w:
        description: 发现的问题列表
        items:
          $ref: '#/definitions/ai.GrammarIssue'
        type: array
    type: object
  ai.GrammarIssue:
    properties:
      length:
        description: 问题长度
        type: integer
      offset:
        description: 问题起始偏移
        type: integer
      original:
        description: 原文
        type: string
      reason:
        description: 错误说明
        type: string
      replacement:
        description: 建议替换
        type: string
      severity:
        description: error | warning | style
        type: string
    type: object
  ai.RewriteResult:
    properties:
      changes:
        description: 改动说明
        items:
          type: string
        type: array
      model:
        description: rule-engine 或 LLM 名称
        type: string
      new_len:
        type: integer
      original_len:
        type: integer
      text:
        description: 改写后文本
        type: string
    type: object
  ai.SummarizeResult:
    properties:
      key_points:
        description: 关键点
        items:
          type: string
        type: array
      summary:
        description: 文字摘要
        type: string
      word_count:
        description: 原文字数
        type: integer
    type: object
  ai.WritingAssistResult:
    properties:
      confidence:
        description: 规则引擎固定 0.6
        type: number
      model:
        description: 使用的模型或 "rule-engine"
        type: string
      text:
        description: 续写内容
        type: string
    type: object
  apitoken.CreatedToken:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      scopes:
        items:
          type: string
        type: array
      token:
        description: Token 原始值，仅在创建响应中出现一次，之后无法再获取。
        type: string
    type: object
  apitoken.TokenVM:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: integer
      last_used_at:
        type: string
      name:
        type: string
      scopes:
        items:
          type: string
        type: array
    type: object
  attachment.Attachment:
    properties:
      content_type:
        type: string
      created_at:
        type: string
      entity_id:
        description: EntityID 为对应 per-type 表中具体 FK 的值（task_id / requirement_id / defect_id）。
        type: integer
      entity_type:
        description: EntityType 由调用方上下文决定，JSON 序列化时回填。
        type: string
      file_name:
        type: string
      file_size:
        type: integer
      id:
        type: integer
      project_id:
        type: integer
      storage_key:
        type: string
      storage_url:
        description: StorageURL 为按需生成的预签名下载 URL，不持久化。
        type: string
      thumb_key:
        type: string
      updated_at:
        type: string
      uploaded_by:
        type: integer
      workspace_id:
        type: integer
    type: object
  attachment.ConfirmUploadResult:
    properties:
      attachment:
        $ref: '#/definitions/attachment.Attachment'
    type: object
  auth.ProviderModifyInput:
    properties:
      attribute_mapping:
        additionalProperties:
          type: string
        type: object
      auth_url:
        type: string
      auto_create_user:
        type: boolean
      client_id:
        type: string
      client_secret:
        type: string
      default_role:
        type: string
      issuer_url:
        type: string
      jwks_url:
        type: string
      name:
        type: string
      protocol:
        description: oidc | saml
        type: string
      redirect_uri:
        type: string
      scopes:
        type: string
      token_url:
        type: string
      userinfo_url:
        type: string
      workspace_id:
        type: integer
    type: object
  auth.TokenPair:
    properties:
      access_token:
        type: string
      expires_at:
        type: string
      refresh_token:
        type: string
      token_type:
        description: Bearer
        type: string
      user:
        $ref: '#/definitions/auth.UserBrief'
    type: object
  auth.UserBrief:
    properties:
      avatar_url:
        type: string
      display_name:
        type: string
      email:
        type: string
      id:
        type: integer
    type: object
  automation.Action:
    properties:
      config:
        additionalProperties: {}
        description: 动作级配置：channel/template/target/strategy 等
        type: object
      field:
        description: 目标字段（transition → state, assign → user_id）
        type: string
      type:
        description: transition | assign | update_field | notify | create_issue |
          copy_field | webhook_call | webhook_deliver
        type: string
      value:
        description: 目标值（支持 ${变量}
    type: object
  automation.Condition:
    properties:
      field:
        description: 'issues 字段路径: severity, state.group, estimate_points'
        type: string
      op:
        description: eq | ne | gt | gte | lt | lte | contains | in | is_empty | is_not_empty
          | changed
        type: string
      value:
        description: 比较值（op=in 时为数组）
    type: object
  automation.ConditionGroup:
    properties:
      all:
        description: '默认: 所有条件均满足'
        items:
          $ref: '#/definitions/automation.ConditionGroup'
        type: array
      any:
        description: 任一条件满足
        items:
          $ref: '#/definitions/automation.ConditionGroup'
        type: array
    type: object
  automation.ExecutionStatus:
    enum:
    - matched
    - skipped
    - success
    - failed
    - dry_run
    type: string
    x-enum-varnames:
    - ExecMatched
    - ExecSkipped
    - ExecSuccess
    - ExecFailed
    - ExecDryRun
  automation.Rule:
    properties:
      action_count:
        type: integer
      consecutive_failures:
        type: integer
      created_at:
        type: string
      created_by:
        type: integer
      description:
        type: string
      dsl:
        $ref: '#/definitions/automation.RuleDSL'
      execution_count:
        type: integer
      id:
        type: integer
      last_error:
        type: string
      last_run_at:
        type: string
      name:
        type: string
      project_id:
        type: integer
      sort_order:
        type: integer
      status:
        $ref: '#/definitions/automation.RuleStatus'
      trigger_type:
        type: string
      updated_at:
        type: string
      workspace_id:
        type: integer
    type: object
  automation.RuleDSL:
    properties:
      actions:
        items:
          $ref: '#/definitions/automation.Action'
        type: array
      condition_group:
        allOf:
        - $ref: '#/definitions/automation.ConditionGroup'
        description: 高级条件组（conditions 为空时生效）
      conditions:
        description: 简单条件列表（all 语义）
        items:
          $ref: '#/definitions/automation.Condition'
        type: array
      trigger:
        $ref: '#/definitions/automation.Trigger'
    type: object
  automation.RuleExecution:
    properties:
      context:
        additionalProperties: {}
        type: object
      created_at:
        type: string
      duration_ms:
        type: integer
      error_message:
        type: string
      id:
        type: integer
      project_id:
        type: integer
      rule_id:
        type: integer
      status:
        $ref: '#/definitions/automation.ExecutionStatus'
      trigger_depth:
        type: integer
      trigger_event_id:
        type: integer
      via_automation:
        type: boolean
      workspace_id:
        type: integer
    type: object
  automation.RuleStatus:
    enum:
    - draft
    - active
    - disabled
    - error
    type: string
    x-enum-varnames:
    - RuleStatusDraft
    - RuleStatusActive
    - RuleStatusDisabled
    - RuleStatusError
  automation.Template:
    properties:
      category:
        type: string
      description:
        type: string
      dsl_template:
        $ref: '#/definitions/automation.RuleDSL'
      icon:
        type: string
      id:
        type: integer
      is_recommended:
        type: boolean
      name:
        type: string
      slug:
        type: string
      sort_order:
        type: integer
    type: object
  automation.Trigger:
    properties:
      cron:
        description: 仅 type=scheduled 时有效
        type: string
      filter:
        additionalProperties: {}
        description: '事件级过滤: { "to_group": "started", "type_code": "defect" }'
        type: object
      type:
        description: issue.created | issue.updated | issue.status_changed | issue.commented
          | sprint.completed | version.released | scheduled
        type: string
    type: object
  dashboard.DashboardData:
    properties:
      alerts:
        description: 未解决风险告警
        items:
          $ref: '#/definitions/dashboard.RiskAlert'
        type: array
      snapshots:
        additionalProperties: {}
        description: key = widget_type, value = snapshot data
        type: object
      widgets:
        items:
          $ref: '#/definitions/dashboard.DashboardWidget'
        type: array
    type: object
  dashboard.DashboardTemplate:
    properties:
      category:
        type: string
      description:
        type: string
      icon:
        type: string
      id:
        type: integer
      is_default:
        type: boolean
      layout:
        additionalProperties: {}
        type: object
      name:
        type: string
      slug:
        type: string
      sort_order:
        type: integer
    type: object
  dashboard.DashboardWidget:
    properties:
      config:
        additionalProperties: {}
        type: object
      created_at:
        type: string
      grid_h:
        type: integer
      grid_w:
        type: integer
      grid_x:
        type: integer
      grid_y:
        type: integer
      id:
        type: integer
      is_visible:
        type: boolean
      project_id:
        type: integer
      sort_order:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
      widget_type:
        $ref: '#/definitions/dashboard.WidgetType'
    type: object
  dashboard.ProjectCompareItem:
    properties:
      active_sprint_count:
        type: integer
      completion_rate:
        type: number
      defect_count:
        type: integer
      done_issues:
        type: integer
      identifier:
        type: string
      project_id:
        type: integer
      project_name:
        type: string
      total_issues:
        type: integer
    type: object
  dashboard.RiskAlert:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      is_resolved:
        type: boolean
      metadata:
        additionalProperties: {}
        type: object
      project_id:
        type: integer
      rule_id:
        type: integer
      severity:
        type: string
      title:
        type: string
    type: object
  dashboard.WidgetType:
    enum:
    - progress_overview
    - burndown
    - velocity
    - priority_split
    - state_distribution
    - overdue_list
    - blocked_list
    - risk_alert
    - recent_activity
    - team_workload
    - version_burndown
    - module_distribution
    - dora
    - project_compare
    type: string
    x-enum-varnames:
    - WidgetProgressOverview
    - WidgetBurndown
    - WidgetVelocity
    - WidgetPrioritySplit
    - WidgetStateDistribution
    - WidgetOverdueList
    - WidgetBlockedList
    - WidgetRiskAlert
    - WidgetRecentActivity
    - WidgetTeamWorkload
    - WidgetVersionBurndown
    - WidgetModuleDistribution
    - WidgetDORA
    - WidgetProjectCompare
  dto.AcceptInvitationRequest:
    properties:
      token:
        description: Token 邀请 URL 中携带的随机 token（原始值，非 hash）。
        type: string
    required:
    - token
    type: object
  dto.AddProjectMemberRequest:
    properties:
      role:
        description: Role 在项目中的角色：admin / member。
        enum:
        - admin
        - member
        type: string
      user_id:
        description: UserID 被添加的用户 ID（必须是同 workspace 成员）。
        minimum: 1
        type: integer
    required:
    - role
    - user_id
    type: object
  dto.BatchError:
    properties:
      code:
        description: Code 错误码（eg. RESOURCE.NOT_FOUND / ISSUE.VERSION_CONFLICT）。
        type: string
      message:
        description: Message 面向终端用户的中文提示（无敏感信息）。
        type: string
      resource_id:
        description: ResourceID 失败的资源 ID（工作项 ID 等）。
        type: integer
    type: object
  dto.BatchResponse:
    properties:
      errors:
        description: Errors 失败条目明细；全部成功时返回空切片（保证前端 null-safety）。
        items:
          $ref: '#/definitions/dto.BatchError'
        type: array
      failed_count:
        description: FailedCount 处理失败的条目数。
        type: integer
      success_count:
        description: SuccessCount 成功处理的条目数。
        type: integer
    type: object
  dto.ChangeRoleRequest:
    properties:
      role:
        description: Role 目标角色（oneof 在后端按上下文校验，前端根据路由传入）。
        type: string
    required:
    - role
    type: object
  dto.CreateApiTokenRequest:
    properties:
      expires_in_seconds:
        description: ExpiresInSeconds 有效期（秒），60 ~ 31536000（365 天）；缺省表示永不过期。
        maximum: 31536000
        minimum: 60
        type: integer
      name:
        description: Name 令牌名称（用途备注），1-80 字符。
        maxLength: 80
        minLength: 1
        type: string
      scopes:
        description: |-
          Scopes 权限范围白名单（至少 1 个，全部须命中 apitoken 白名单）。
          可选值：read:workspace write:workspace read:issues write:issues
          read:sprints write:sprints read:versions write:versions read:audit *
        items:
          type: string
        maxItems: 20
        minItems: 1
        type: array
    required:
    - name
    - scopes
    type: object
  dto.CreateProjectRequest:
    properties:
      color:
        description: Color Hex 主题色（如 `#2563eb`），7 字符定长。
        type: string
      cover_image_url:
        description: CoverImageUrl 封面图片 URL（可选）；传空字符串表示清除。
        maxLength: 500
        type: string
      description:
        description: Description 项目简介，最长 500 字符。
        maxLength: 500
        type: string
      icon:
        description: Icon Emoji 或图标标识，最长 32 字符。
        maxLength: 32
        type: string
      identifier:
        description: Identifier 项目前缀（2-6 位大写字母），用于工作项标识（如 `PROJ-12`），留空则自动生成。
        maxLength: 6
        type: string
      modules:
        description: Modules 功能模块开关；null 表示全部启用。
        properties:
          estimate:
            type: boolean
          sprint:
            type: boolean
          version:
            type: boolean
        type: object
      name:
        description: Name 项目名称，1-80 字符。
        maxLength: 80
        minLength: 1
        type: string
      network:
        description: Network 可见性：public（空间内默认可见） / private（仅成员可见） / internal（仅项目成员可见）。默认
          public。
        enum:
        - public
        - private
        - internal
        type: string
      slug:
        description: Slug 友好 URL 片段，留空则由 Name 自动生成。
        maxLength: 60
        type: string
      template:
        description: Template 项目模板代码：agile（敏捷） / waterfall（瀑布） / generic（通用看板），默认
          generic。
        enum:
        - agile
        - waterfall
        - generic
        type: string
    required:
    - name
    type: object
  dto.CreateWorkspaceRequest:
    properties:
      language:
        description: Language 界面语言代码，支持 zh-CN / en-US / en。
        enum:
        - zh-CN
        - en-US
        - en
        type: string
      name:
        description: Name 工作空间显示名，1-80 字符。
        maxLength: 80
        minLength: 1
        type: string
      slug:
        description: Slug 友好 URL 标识符，留空则由后端根据 Name 自动生成。格式：^[a-z0-9-]+$。
        maxLength: 60
        type: string
      timezone:
        description: Timezone IANA 时区名（如 Asia/Shanghai），默认 UTC。
        type: string
    required:
    - name
    type: object
  dto.SendInvitationRequest:
    properties:
      email:
        description: Email 被邀请人的邮箱（唯一标识，用于账户匹配）。
        type: string
      message:
        description: Message 附赠的邀请说明，显示在邀请邮件中。
        maxLength: 500
        type: string
      role:
        description: Role 邀请时预设的角色；被邀请人接受后直接获得该角色。
        enum:
        - admin
        - member
        - guest
        type: string
    required:
    - email
    - role
    type: object
  dto.UpdateProjectRequest:
    properties:
      color:
        description: Color 新主题色；nil 表示不更新。
        type: string
      cover_image_url:
        description: CoverImageUrl 新封面图片 URL；nil 表示不更新；传空字符串表示清除。
        maxLength: 500
        type: string
      description:
        description: Description 新简介；nil 表示不更新。
        type: string
      icon:
        description: Icon 新图标；nil 表示不更新。
        type: string
      modules:
        description: Modules 功能模块开关；null 表示不更新（非 nil 则整体替换）。
        properties:
          estimate:
            type: boolean
          sprint:
            type: boolean
          version:
            type: boolean
        type: object
      name:
        description: Name 新名称；nil 表示不更新。
        maxLength: 80
        minLength: 1
        type: string
      network:
        description: Network 新可见性；nil 表示不更新。
        enum:
        - public
        - private
        - internal
        type: string
      slug:
        description: Slug 新 URL 片段；nil 表示不更新。
        type: string
    type: object
  dto.UpdateWorkspaceRequest:
    properties:
      brand_color:
        description: 'BrandColor 工作空间品牌主色（HEX 格式，如 #3B82F6）；nil 表示不更新。'
        type: string
      language:
        description: Language 新的语言代码；nil 表示不更新。
        enum:
        - zh-CN
        - en-US
        - en
        type: string
      logo_url:
        description: LogoURL 工作空间 Logo 的公开 URL；nil 表示不更新，传空字符串表示清除。
        maxLength: 500
        type: string
      name:
        description: Name 新的显示名；nil 表示不更新。
        maxLength: 80
        minLength: 1
        type: string
      timezone:
        description: Timezone 新的时区；nil 表示不更新。
        type: string
    type: object
  errs.AppError:
    properties:
      code:
        description: |-
          Code 为唯一错误码，由 "DOMAIN.SNAKE_CASE" 格式的 ASCII 字符串构成。
          是前端做国际化映射（i18n key）和告警分组的依据。
        type: string
      details:
        description: |-
          Details 携带字段级校验错误明细，通常用于请求体（DTO）参数校验失败场景。
          如果无字段级错误，该 slice 应为 nil（JSON 序列化时被 omitempty 省略）。
        items:
          $ref: '#/definitions/errs.FieldDetail'
        type: array
      message:
        description: |-
          Message 是面向终端用户的中文提示文案，可直接渲染到 UI。
          要求：简洁、可理解、无敏感堆栈信息。前端根据此字段作为 fallback 文案展示。
        type: string
    type: object
  errs.FieldDetail:
    properties:
      field:
        description: |-
          Field 为请求参数名或 JSON path（如 "title"、"assignee.id"），
          前端可根据此字段将错误文案定位到对应表单控件。
        type: string
      reason:
        description: |-
          Reason 为该字段的具体错误原因（中文），如 "不能超过 255 个字符"、"格式不符合邮箱规范"。
          要求：简洁、无敏感信息、可直接渲染。
        type: string
    type: object
  httpapi.LogoUploadResult:
    properties:
      logo_url:
        type: string
    type: object
  httpapi.forgotPasswordRequest:
    properties:
      email:
        type: string
    required:
    - email
    type: object
  httpapi.loginRequest:
    properties:
      email:
        example: alice@example.com
        type: string
      password:
        example: your-password
        type: string
    type: object
  httpapi.refreshRequest:
    properties:
      refresh_token:
        type: string
    type: object
  httpapi.registerRequest:
    properties:
      display_name:
        example: Alice
        type: string
      email:
        example: alice@example.com
        type: string
      password:
        example: new-password
        type: string
    type: object
  httpapi.resetPasswordRequest:
    properties:
      new_password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - new_password
    - token
    type: object
  httpapi.ssoProviderDetail:
    properties:
      attribute_mapping:
        additionalProperties:
          type: string
        type: object
      auth_url:
        type: string
      auto_create_user:
        type: boolean
      client_id:
        type: string
      default_role:
        type: string
      has_client_secret:
        type: boolean
      id:
        type: integer
      issuer_url:
        type: string
      jwks_url:
        type: string
      name:
        type: string
      protocol:
        type: string
      redirect_uri:
        type: string
      scopes:
        type: string
      token_url:
        type: string
      userinfo_url:
