        in: path
        name: view_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
      summary: 设置默认视图
      tags:
      - preference
  /webhooks:
    get:
      description: 列出工作空间下的全部 Webhook 订阅，支持分页与项目过滤
      parameters:
      - description: 项目 ID
        in: query
        name: project_id
        type: integer
      - description: 每页数 (1-100)
        in: query
        name: limit
        type: integer
      - description: 偏移
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 列出 Webhook
      tags:
      - webhook
