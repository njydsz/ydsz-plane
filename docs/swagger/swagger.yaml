        type: string
      - description: 更新时间上限 (RFC3339, e.g. 2025-06-30T23:59:59Z)
        in: query
        name: updated_before
        type: string
      - description: 稀疏字段集，逗号分隔 (e.g. id,name,state,priority)。不传返回完整字段。
