      consumes:
      - application/json
      description: 在工作空间下新建一个 Webhook 订阅，创建时返回 secret（后续不再返回）
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/errs.AppError'
      summary: 创建 Webhook
      tags:
      - webhook
  /webhooks/{webhook_id}:
    delete:
      description: 删除指定 Webhook 订阅
      parameters:
      - description: Webhook ID
        in: path
        name: webhook_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
      summary: 删除 Webhook
      tags:
      - webhook
    get:
      description: 返回单个 Webhook 的完整配置（不含 secret）
      parameters:
      - description: Webhook ID
        in: path
        name: webhook_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhook.Webhook'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.AppError'
      summary: 获取 Webhook 详情
      tags:
      - webhook
    patch:
      consumes:
      - application/json
      description: PATCH 更新 Webhook 的 URL / 事件 / 名称 / 启用状态
      parameters:
      - description: Webhook ID
        in: path
        name: webhook_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/webhook.Webhook'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/errs.AppError'
      summary: 更新 Webhook
      tags:
      - webhook
  /webhooks/{webhook_id}/logs:
    get:
      description: 分页查询指定 Webhook 的投递日志，支持状态/事件类型过滤
      parameters:
      - description: Webhook ID
        in: path
        name: webhook_id
        required: true
        type: integer
      - description: 投递状态
        in: query
        name: status
        type: string
      - description: 事件类型
        in: query
        name: event_type
        type: string
      - description: 每页数
        in: query
        name: limit
        type: integer
      - description: 偏移
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: 列出投递日志
      tags:
      - webhook
