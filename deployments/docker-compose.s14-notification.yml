# Ydsz Plane S14 Phase-1 — 通知服务独立部署
#
# 启动方式：
#   docker compose -f deployments/docker-compose.s14-notification.yml up -d
#
# 说明：
#   - 本 compose 文件是现有 docker-compose.yml 的增量补充
#   - 通知服务使用独立 PostgreSQL（notification_db）
#   - RabbitMQ 与核心应用共享（同一 event exchange）
#   - core-service 通过 GRPC_URL=notification-svc:9090 连接
#
# 前置条件：
#   - 主应用已部署（ydsz-plane-core 已在运行）
#   - notification_db schema 迁移已执行（见 sql/notification_schema_v1.sql）

version: "3.8"

services:
  # ---------------------------------------------------------
  # 通知服务（独立部署）
  # ---------------------------------------------------------
  notification-svc:
    build:
      context: ../
      dockerfile: build/Dockerfile.notification
    container_name: ydsz-plane-notification
    restart: unless-stopped
    ports:
      - "9090:9090"    # gRPC
      - "8080:8080"    # Health + Metrics HTTP
    environment:
      SERVICE_NAME: notification-service
      GRPC_PORT: "9090"
      HEALTH_PORT: "8080"
      DATABASE_URL: postgres://notif_user:notif_pass@notification_db:5432/notifications?sslmode=disable
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      REDIS_ADDR: redis:6379
      LOG_LEVEL: info
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: "noreply@njydsz.com"
      WEBHOOK_SIGNING_KEY: ${WEBHOOK_SIGNING_KEY:-changeme}
    depends_on:
      notification_db:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M
    networks:
      - ydsz-plane-net

  # ---------------------------------------------------------
  # 通知服务独立 PostgreSQL
  # ---------------------------------------------------------
  notification_db:
    image: postgres:18-alpine
    container_name: ydsz-plane-notification-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: notif_user
      POSTGRES_PASSWORD: notif_pass
      POSTGRES_DB: notifications
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
      - ../sql/notification_schema_v1.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notif_user -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    networks:
      - ydsz-plane-net

volumes:
  notification_pg_data:

networks:
  ydsz-plane-net:
    external: true
