# 性能压测（k6）— 按需 + 每周日触发。
# 需在仓库 Secrets 配置目标 API 地址与鉴权环境。
# 脚本：tests/perf/{smoke-test,load-test,stress-test}.js
name: Performance

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Target API base URL (e.g. https://staging.example.com/api/v1)"
        required: true
        default: "http://localhost:8080/api/v1"
      email:
        description: "Test user email"
        required: false
        default: "admin@ydsz.dev"
      password:
        description: "Test user password"
        required: false
        default: "Admin@123"
  schedule:
    - cron: "0 2 * * 0" # 每周日 02:00

jobs:
  k6:
    name: k6 Load Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run k6 smoke test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/perf/smoke-test.js
          flags: >-
            -e BASE_URL=${{ github.event.inputs.api_url || 'http://localhost:8080/api/v1' }}
            -e TEST_USER_EMAIL=${{ github.event.inputs.email || secrets.TEST_USER_EMAIL || 'admin@ydsz.dev' }}
            -e TEST_USER_PASSWORD=${{ github.event.inputs.password || secrets.TEST_USER_PASSWORD || 'Admin@123' }}
      - name: Run k6 load test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/perf/load-test.js
          flags: >-
            -e BASE_URL=${{ github.event.inputs.api_url || 'http://localhost:8080/api/v1' }}
            -e TEST_USER_EMAIL=${{ github.event.inputs.email || secrets.TEST_USER_EMAIL || 'admin@ydsz.dev' }}
            -e TEST_USER_PASSWORD=${{ github.event.inputs.password || secrets.TEST_USER_PASSWORD || 'Admin@123' }}
      - name: Run k6 stress test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/perf/stress-test.js
          flags: >-
            -e BASE_URL=${{ github.event.inputs.api_url || 'http://localhost:8080/api/v1' }}
            -e TEST_USER_EMAIL=${{ github.event.inputs.email || secrets.TEST_USER_EMAIL || 'admin@ydsz.dev' }}
            -e TEST_USER_PASSWORD=${{ github.event.inputs.password || secrets.TEST_USER_PASSWORD || 'Admin@123' }}
      - name: Upload k6 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: |
            summary.json
            html-report.html
          if-no-files-found: ignore
