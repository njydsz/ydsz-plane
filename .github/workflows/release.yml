name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  GO_VERSION: '1.26'
  NODE_VERSION: '20'
  PNPM_VERSION: '10'

jobs:
  release:
    name: Build & Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build API binary
        run: CGO_ENABLED=0 GOOS=linux go build -o dist/ydsz-plane-api ./cmd/api

      - name: Build Worker binary
        run: CGO_ENABLED=0 GOOS=linux go build -o dist/ydsz-plane-worker ./cmd/worker

      - name: Build Migrate binary
        run: CGO_ENABLED=0 GOOS=linux go build -o dist/ydsz-plane-migrate ./cmd/migrate

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Build web frontend
        run: |
          cd web
          pnpm install --frozen-lockfile
          pnpm build
          cd ..
          tar -czf dist/web-dist.tar.gz -C web dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          generate_release_notes: true
          files: |
            dist/ydsz-plane-api
            dist/ydsz-plane-worker
            dist/ydsz-plane-migrate
            dist/web-dist.tar.gz
