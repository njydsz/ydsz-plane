# ============================================================================
# Ydsz Plane — CI/CD 完整流水线
# 对标: 字节跳动/美团 Go 项目 CI 标准
# 触发: push/PR 到 main, 手动触发
# ============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"

jobs:
  # ------------------------------------------------------------------
  # Job 1: Go 静态分析 + 编译校验
  # ------------------------------------------------------------------
  go-lint-build:
    name: Go Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go vet
        run: go vet $(go list ./... | grep -v '/web/node_modules/')

      - name: go build
        run: go build $(go list ./... | grep -v '/web/node_modules/')

      - name: go mod tidy check
        run: |
          go mod tidy -diff
          if [ $? -ne 0 ]; then
            echo "::error::go.mod 与 go.sum 不一致，请运行 go mod tidy 后提交"
            exit 1
          fi

  # ------------------------------------------------------------------
  # Job 2: Go 单元测试（race detector）
  # ------------------------------------------------------------------
  go-test:
    name: Go Test (race)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ydsz_app
          POSTGRES_PASSWORD: ydsz_test
          POSTGRES_DB: ydsz_plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      YDSZ_DATABASE_URL: "postgres://ydsz_app:ydsz_test@localhost:5432/ydsz_plane_test?sslmode=disable"
      YDSZ_REDIS_ADDR: "localhost:6379"
      YDSZ_REDIS_PASSWORD: ""
      YDSZ_SERVER_ENV: "development"
      YDSZ_AUTH_JWT_SECRET: "ci-test-secret-key-at-least-32-bytes-long!!"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: init test schema
        run: |
          PGPASSWORD=ydsz_test psql -h localhost -U ydsz_app -d ydsz_plane_test \
            -v ON_ERROR_STOP=1 \
            -f sql/ydsz-plane-init.sql

      - name: go test with coverage
        run: |
          PKGS=$(go list ./... | grep -v '/web/node_modules/' | grep -v '/scripts/')
          go test -race -count=1 -timeout 300s -coverprofile=coverage.out -covermode=atomic $PKGS
          echo "--- 覆盖率摘要 ---"
          go tool cover -func=coverage.out | tail -1

      - name: upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-${{ github.run_number }}
          path: coverage.out
          retention-days: 14

  # ------------------------------------------------------------------
  # Job 2b: Go 深度静态分析（golangci-lint）
  # ------------------------------------------------------------------
  go-linter:
    name: Go Linter (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62
          args: --config=.golangci.yml --timeout 5m

  # ------------------------------------------------------------------
  # Job 3: Go 依赖安全扫描
  # ------------------------------------------------------------------
  go-security:
    name: Go Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: govulncheck
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@latest $(go list ./... | grep -v '/web/node_modules/')

  # ------------------------------------------------------------------
  # Job 4: Web 前端审计
  # ------------------------------------------------------------------
  web-audit:
    name: Web Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: install deps
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        run: pnpm audit --prod --audit-level=high

      - name: type check
        run: pnpm type-check 2>/dev/null || echo "::warning::type-check 未配置"

      - name: lint
        run: pnpm lint 2>/dev/null || echo "::warning::lint 未配置"

  # ------------------------------------------------------------------
  # Job 4: API 冒烟门禁（启动服务 + 健康检查）
  # ------------------------------------------------------------------
  smoke:
    name: API Smoke (healthz + readyz)
    runs-on: ubuntu-latest
    needs: [go-lint-build]  # 编译通过后再冒烟

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ydsz_app
          POSTGRES_PASSWORD: ydsz_test
          POSTGRES_DB: ydsz_plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      YDSZ_DATABASE_URL: "postgres://ydsz_app:ydsz_test@localhost:5432/ydsz_plane_test?sslmode=disable"
      YDSZ_REDIS_ADDR: "localhost:6379"
      YDSZ_REDIS_PASSWORD: ""
      YDSZ_SERVER_ENV: "development"
      YDSZ_AUTH_JWT_SECRET: "ci-test-secret-key-at-least-32-bytes-long!!"
      YDSZ_STORAGE_SECRET_KEY: "ci-test-storage-secret-key-at-least-32-bytes!"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: init database schema
        run: |
          PGPASSWORD=ydsz_test psql -h localhost -U ydsz_app -d ydsz_plane_test \
            -v ON_ERROR_STOP=1 \
            -f sql/ydsz-plane-init.sql

      - name: build API binary
        run: go build -o /tmp/ydsz-api ./cmd/api

      - name: start API server (background)
        run: |
          /tmp/ydsz-api > /tmp/api.log 2>&1 &
          echo "API_PID=$!" >> $GITHUB_ENV
          # 等待服务就绪（最长 30 秒）
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null 2>&1; then
              echo "API started after ${i}s"
              break
            fi
            sleep 1
          done

      - name: smoke — /healthz returns 200
        run: |
          RESP=$(curl -sf -w "\n%{http_code}" http://localhost:8080/healthz)
          CODE=$(echo "$RESP" | tail -1)
          if [ "$CODE" != "200" ]; then
            echo "::error::healthz returned HTTP $CODE, expected 200"
            cat /tmp/api.log
            exit 1
          fi
          echo "✅ /healthz → 200 OK"

      - name: smoke — /readyz returns 200 with DB+Redis up
        run: |
          RESP=$(curl -sf -w "\n%{http_code}" http://localhost:8080/readyz)
          CODE=$(echo "$RESP" | tail -1)
          BODY=$(echo "$RESP" | head -1)
          if [ "$CODE" != "200" ]; then
            echo "::error::readyz returned HTTP $CODE (expected 200), body: $BODY"
            cat /tmp/api.log
            exit 1
          fi
          echo "✅ /readyz → 200 OK, body: $BODY"

      - name: stop API server
        if: always()
        run: |
          if [ -n "$API_PID" ]; then kill $API_PID 2>/dev/null || true; fi

  # ------------------------------------------------------------------
  # Job 5: CodeQL 安全分析
  # ------------------------------------------------------------------
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["go", "javascript-typescript"]
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
