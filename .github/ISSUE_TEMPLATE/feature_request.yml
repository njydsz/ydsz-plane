name: 功能建议
description: 提议新功能或改进现有能力
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助 Ydsz Plane 变得更好！请描述你想要的场景和价值。

  - type: textarea
    id: problem
    attributes:
      label: 问题 / 场景
      description: 你在什么场景下遇到了什么问题？（用户故事视角）
      placeholder: |
        作为 <角色>，我希望 <能力>，因为 <原因>。
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 你设想的解决方式是怎样的？（可选多个）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 你目前用什么方式 workaround？

  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 竞品参考、Similar PR、设计草稿、截图等

  - type: checkboxes
    id: willing
    attributes:
      label: 参与意愿
      options:
        - label: 我愿意提交 PR 实现这个功能
        - label: 我可以提供详细的设计文档供讨论
        - label: 我可以帮助测试 / 收集用户反馈
